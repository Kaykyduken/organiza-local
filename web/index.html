<!DOCTYPE html>
<!--
  OrganizaLocal — interface web.
  Este mesmo HTML é publicado na Vercel e também servido pelo programa local
  (http://127.0.0.1:8765). Ele não processa arquivos: só conversa com a API do
  programa que roda no computador do usuário.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OrganizaLocal: organiza automaticamente seus downloads e faz backups versionados, tudo no seu computador.">
  <title>OrganizaLocal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 11h7l2 2h7v9H8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="claro">
  <div class="premium-aurora" aria-hidden="true"><span></span></div>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 10h8l2.5 2.5H26V24H6z" fill="currentColor"/></svg>
        </div>
        <strong>OrganizaLocal</strong>
      </div>
      <button id="menuToggle" class="ghost only-mobile" aria-label="Menu de seções" aria-controls="nav" aria-expanded="false">☰</button>
      <div id="connection" class="pill" role="status">Conectando…</div>
    </header>
    <div class="layout">
      <nav id="nav" aria-label="Seções">
        <button data-tab="painel" class="active" aria-current="page"><span data-icon="painel" aria-hidden="true"></span>Painel</button>
        <button data-tab="regras"><span data-icon="regras" aria-hidden="true"></span>Regras</button>
        <button data-tab="organizacao"><span data-icon="organizacao" aria-hidden="true"></span>Organização</button>
        <button data-tab="backups"><span data-icon="backups" aria-hidden="true"></span>Backups</button>
        <button data-tab="historico"><span data-icon="historico" aria-hidden="true"></span>Histórico</button>
        <div class="nav-section">Recursos e controle</div>
        <button data-tab="ferramentas"><span data-icon="ferramentas" aria-hidden="true"></span>Ferramentas</button>
        <button data-tab="seguranca"><span data-icon="seguranca" aria-hidden="true"></span>Segurança</button>
        <button data-tab="sistema"><span data-icon="sistema" aria-hidden="true"></span>Sistema</button>
        <button data-tab="config"><span data-icon="config" aria-hidden="true"></span>Configurações</button>
        <div class="navfoot" id="navfoot"></div>
      </nav>
      <main id="main" tabindex="-1"><section class="card" role="status"><h2>Carregando…</h2></section></main>
    </div>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="journeys.js" defer></script>
  <script src="workspace-views.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
